[project]
name = "agentic-ai-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# M01 ~ M02 노트북 실행에 필요한 의존성.
# (노트북의 utils.uv_install() 셀은 이미 설치된 패키지를 확인만 하고 넘어감)
dependencies = [
    # base / Jupyter
    "python-dotenv>=1.0",
    "ipykernel>=6.29",
    "requests>=2.31",
    "httpx>=0.27",
    "pydantic>=2.0",
    # LLM SDK
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0",
    # LangChain / LangGraph
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langgraph>=0.2.0",
    # 도구 (M02_3 웹 검색)
    "ddgs>=9.0",
    # MCP / A2A (M02_4, M02_5)
    "fastmcp>=2.0",
    "a2a-sdk[http-server]>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
]
